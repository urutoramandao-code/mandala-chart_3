var P="mandala:",DEFAULT_CRIT="# PG\n## 開発工程の理解\n要件定義の流れ|要件定義の入力と成果物を3つ以上挙げ、自案件の要件定義書を使って5分で説明できる(リーダーが聞いて判定)\n基本設計とは|基本設計書の画面・機能・外部IFが何を決めているかを、自案件の設計書を指して説明できる\n詳細設計書を読む|担当機能の処理フローを詳細設計書から書き起こし、リーダーの確認で誤りが0件\n製造・単体テスト|詳細設計どおりに実装し、単体テストを全件実施して未消化0件、設計との相違の指摘0件\n結合・総合テスト|結合テストと総合テストの目的・対象範囲の違いを説明でき、自案件のテスト仕様書の該当箇所を示せる\nリリース手順|リリース手順書に沿った作業を、先輩の立ち会いで1回以上実施し、手戻りなく完了できる\n保守・障害対応|障害票1件の原因をログから特定し、事象・原因・対処の3項目を書いた一次切り分け報告を出せる\nウォーターフォールとアジャイル|両者の特徴と違いを各3点挙げ、自案件がどちらで、なぜそうなっているかを説明できる\n## 言語・FWの習得\n文法の基礎|変数・条件分岐・繰り返し・配列を使った課題(100件の集計処理など)を、資料なしで30分以内に実装できる\nオブジェクト指向|継承・ポリモーフィズム・カプセル化を、自作のコード例を示して各1分で説明できる\n標準ライブラリ|文字列・日付・コレクションの主要メソッドを、調べずに使い、課題3問が全問動作する\nFW(Spring等)|FWで一覧取得APIまたは画面を1つ作り、起動して動作確認できる\n例外処理|入力不正・DB接続失敗・該当なしの3パターンを、try-catchと独自例外で処理し、動作確認できる\nログ出力|ログレベルの使い分けを説明でき、障害調査に必要な情報(入力値・処理ID)が出る実装を1機能で書ける\nコーディング規約|案件の規約に沿って書いたコードが、静的解析またはレビューで規約違反0件\nコードリーディング|既存コードの担当範囲の処理フロー図を自力で書き、先輩の確認で重大な誤りが0件\n## テスト力\n単体テスト仕様書|担当機能の単体テスト仕様書を作成し、レビューで観点漏れの重大指摘が0件\n境界値・同値分割|入力項目3つ以上について、境界値と同値分割でテストケースを導出し、根拠を説明できる\nテストデータ作成|正常系・異常系を網羅するテストデータを自力で用意し、再実行しても結果が再現する\nエビデンス取得|全テストケースの結果を画面・ログなどの証跡つきで提出し、レビューで再取得の指示が0件\nJUnit等|JUnit等で担当クラスの単体テストを書き、全件成功し、主要分岐のカバレッジが80%以上\n不具合票|不具合票を、再現手順・期待結果・実際の結果・原因の4項目を埋めて書き、差し戻しが0件\nデバッグ手法|ブレークポイントまたはログで不具合1件の原因行を特定し、修正前後の挙動を説明できる\n再現手順の整理|報告した不具合の再現手順を、他の人が手順どおりに実行して再現できる(1件以上で確認)\n## 資格取得\n基本情報技術者|基本情報技術者試験に合格(合格証書または成績通知を提示)\nAWS CLF|AWS認定クラウドプラクティショナーに合格(認定番号を提示)\nOracle Silver|Oracle Master Silver SQL(または同等)に合格(認定番号を提示)\nLPIC-1|LPIC Level 1に合格(認定番号を提示)\nJava Silver|Oracle認定Java SE Silverに合格(認定番号を提示)\n過去問演習|目標資格の過去問を直近3年分解き、最新回の模擬点が合格基準以上\n学習時間の確保|週5時間以上の学習を4週間連続で実施し、学習記録で確認できる\n応用情報に着手|応用情報技術者試験の受験申込を済ませ、午前の過去問1回分で60%以上取れている\n## AI活用\nCopilot導入|社内ルールの範囲でAIコーディング支援を自分の環境に導入し、実際に使った記録が1件以上ある\nプロンプトの型|「目的・前提・制約・出力形式」を含む型を自作し、同じ課題で、型なしより修正回数が減ることを示せる\nコード生成|AIで生成した関数を1つ以上、自分でテストして動作確認し、本番コードに採用できる品質にできる\nエラー調査|エラーログをAIに渡して原因候補を出し、再現確認して正解を特定した事例が1件以上\nテストコード生成|AIでテストコードを生成し、人が追加・修正して全件成功し、レビュー指摘が0件\nドキュメント要約|設計書・仕様書をAIで要約し、原本と照合して誤りを直した版を作れる\n出 n設計標準|案件の設計標準(書式・命名・粒度)に沿って作成し、標準違反の指摘が0件\nトレーサビリティ|要件・設計・テストの対応表を作成し、未対応の要件が0件\n用語の統一|用語集を作成し、設計書内の表記ゆれが0件(レビューで確認)\nレビュー主導|設計レビューの事前配布・指摘集約・議事録・完了報告までを、1回通して主催して実施できる\n## DB・アーキ設計\nER設計|業務要件から第3正規形のER図を作成し、レビューで正規化の指摘が0件\nテーブル定義|型・桁・制約・キー・NULL可否を全項目定義したテーブル定義書を作成し、実装時の修正が0件\nAPI設計|エンドポイント・リクエスト・レスポンス・エラーコードを定義したAPI仕様書を作成し、利用側との認識齟齬が0件\nインデックス設計|主要クエリ3本について、インデックス案と実行計画に基づく根拠を示せる\nアーキ図作成|コンポーネント・通信・データの流れを描いた構成図を作り、第三者が5分で全体を説明できる\n技術比較|技術の選択肢2〜3案を、性能・コスト・保守性・習熟度の観点で比較表にし、推奨理由を示せる\n設計パターン|代表的な設計パターン3つについて、使いどころと自案件への適用例を説明できる\nマイクロサービス基礎|モノリスとの違いと、分割の利点・欠点を各3点説明でき、自案件への適否を判断できる\n## 資格取得\n応用情報技術者|応用情報技術者試験に合格(合格証書を提示)\nAWS SAA|AWS認定ソリューションアーキテクト アソシエイトに合格(認定番号を提示)\nデータベース|データベーススペシャリスト試験(または同等のDB資格)に合格\nAzure|Azure Fundamentals(AZ-900)以上に合格(認定番号を提示)\nネットワーク|ネットワークスペシャリスト試験またはCCNAに合格\n高度試験に着手|高度試験の受験申込を済ませ、午前Ⅱの過去問で60%以上取れている\nセキュリティマネ|情報セキュリティマネジメント試験または情報処理安全確保支援士試験に合格\n学習計画|半年分の資格学習計画(目標・日程・週あたり時間)を作成し、直近3か月の計画に対する実施率が80%以上\n## AI活用の設計\nAIレビュー|AIに設計書・コードをレビューさせ、指摘の採否を判断した記録が10件以上あり、採用した指摘で品質改善が確認できる\n設計書のAI下書き|AIで作った設計書の下書きを人が検証・修正し、レビュー指摘数が通常以下で提出できた実績が1件以上\nテスト自動生成|AIでテストケース案を作り、境界値・異常系の漏れが人のレビューで見つからない(漏れ0件)\nプロンプト整備|案件用のプロンプト集(用途・入力・出力例)を5本以上作り、チームの他の人が使って期待どおりの結果が出る\n品質担保の仕組み|AI出力の検証手順(実行確認・仕様照合・レビュー)を文書化し、運用中のAI利用成果物の品質事故が0件\n情報漏洩対策|入力してはいけない情報の基準を作成してチームに周知し、違反が0件\nチーム共有|AI活用の成功例・失敗例を月1回以上共有し、他メンバーの利用者が増えたことを確認できる\n効果の数値化|AI活用の前後で工数やレビュー指摘数を比較し、数値で効果を報告できる\n## 顧客折衝\n傾聴・質問|打合せで顧客の発言を要約して復唱し、認識違いが議事録の確認で0件\n課題の深掘り|要望の背景を「なぜ」で3段階以上掘り下げ、真の課題を1文にまとめて顧客に確認できる\n議事録と合意|議事録を当日中に共有し、顧客から訂正指示なしで承認される(直近3回)\n資料作成|顧客向けの説明資料を作り、顧客からの再作成の指示が0件\n要望の調整|相反する要望2つ以上について、影響を整理して優先順位案を示し、顧客の合意を得た実績が1件以上\n工数の説明|見積工数の根拠(前提・内訳・リスク)を顧客に説明し、再説明を求められずに承認される\n断り方・代替案|対応できない要望に、理由と代替案2案以上を示し、顧客の了承を得た実績が1件以上\n信頼関係の構築|顧客からの指名や次の相談が、直近3か月で1件以上ある(顧客のメール・発言で確認)\n## 非機能要件\n性能設計|主要処理の目標応答時間と同時接続数を数値で定義し、根拠を説明できる\n負荷テスト|負荷テスト計画を作成して実施し、目標値の達成・未達と対策をレポートにまとめられる\nセキュリティ設計|OWASP Top10のうち5項目以上について自案件の対策を設計書に記載し、脆弱性診断で重大指摘が0件\n可用性・冗長化|可用性目標(稼働率)を定め、単一障害点を洗い出して、冗長化の方針を提案できる\n監視・運用設計|監視項目・閾値・通知先・一次対応手順を設計書にまとめ、運用担当のレビューで承認される\nバックアップ|RPO・RTOを定義し、バックアップ方式と復旧手順を作成し、復旧テストを1回実施して目標内で復旧できる\n移行設計|移行手順・リハーサル計画・切り戻し基準を作成し、リハーサルでの手順書の修正が3件以下\n障害対応設計|障害時の連絡体制・初動手順・影響範囲の判断基準をまとめ、訓練を1回実施して手順の不備を洗い出せる\n## 後輩指導\nコードレビュー|後輩のコードを直近5件レビューし、指摘の理由と改善案を添え、再レビューで同じ指摘が0件\n質問に答える|答えだけでなく考え方を示して回答し、直近1か月で後輩の同種の再質問が0件\nタスク分解|後輩向けの作業を、1タスク半日〜2日の粒度に分け、完了条件を書いて渡し、手戻りが0件\n育成計画|後輩ごとに3か月の目標と週次の確認項目を書いた育成計画を作り、月1回振り返る\nフィードバック|良い点と改善点を具体的な事実で月1回以上伝え、後輩への簡易アンケート(5段階)で分かりやすさが4以上\nナレッジ共有|手順書やFAQを作成して共有し、関連する質問件数が減ったことを確認できる\n勉強会開催|技術共有の勉強会を1回以上主催し、参加者アンケートの満足度が5段階で4以上\n任せて見守る|後輩に1つの作業を任せ、途中の介入を3回以内に抑えて、期限内に完了させる\n\n# PL\n## 計画・見積・WBS\nWBS作成|案件のWBSを、作業単位(1〜3日)まで分解して作成し、抜け漏れの指摘が3件以下\n工数見積|類似実績や3点見積などで工数を見積り、実績との差が±20%以内\nスケジュール|依存関係を整理したスケジュールを作り、クリティカルパスを示せる\n要員計画|必要スキル・人数・時期を整理した要員計画を作成し、不足を満たす手配案を提示できる\nマイルストーン|主要なマイルストーンと判定基準を設定し、各達成判定を事実で説明できる\n前提条件の整理|見積・計画の前提条件を10項目以内で明文化し、顧客の合意を得られる\n見積根拠の説明|見積の内訳と根拠を顧客に説明し、再見積の依頼が0回で承認される\n再計画|遅延や変更が起きたとき、影響を整理した再計画を作り、3営業日以内に関係者の合意を得た実績が1件以上\n## 進捗・課題・リスク管理\n進捗会議運営|定例会議を、アジェンダ事前共有・時間内終了・議事録配布まで、直近4回すべて実施している\n課題管理表|課題の担当・期限・状況を管理し、期限超過の課題が全体の10%以下\nリスク洗い出し|プロジェクト開始時にリスクを10件以上洗い出し、対策と発生時の対応を記載し、定期的に見直している\n遅延の予兆検知|進捗率と消化工数の乖離が10%を超えたタスクを週次で抽出し、遅延の発生前に対策を打った実績が1件以上\nEVM基礎|PV・EV・ACからSPI・CPIを計算し、数値の意味を説明できる\nエスカレーション|エスカレーション基準(影響度・期限)を定め、基準を超えた事象を当日中に報告した実績が1件以上\n変更管理|変更要求を影響評価・承認・反映の手順で処理し、承認なしの変更が0件\n障害対応の指揮|障害発生時に役割分担・情報共有・復旧判断を指揮し、復旧後の報告書を期限内に提出した実績が1件以上\n## 品質管理・テスト戦略\n品質基準策定|品質基準(バグ密度・テスト消化率・重要度別の許容件数)を数値で定義し、顧客と合意できる\nテスト計画|テスト範囲・観点・環境・体制・スケジュールを書いたテスト計画書を作成し、レビューで重大指摘が0件\nレビュー計画|成果物ごとのレビュー方法・担当・時期を計画し、計画どおりに実施した率が90%以上\nバグ分析|バグを原因・工程・機能で集計し、傾向と対策案を報告できる\n品質指標管理|バグ密度・消化率・収束状況を週次で報告し、基準を外れたときに対策を提示できる\n受入基準|受入テストの合格基準を顧客と事前に合意し、書面に残している\nリリース判定|判定基準に基づいてリリース可否を判断し、根拠資料つきで顧客に提示して承認を得られる\n再発防止策|重大障害1件について、真因・再発防止策・効果確認の方法を書いたレポートを作成し、同じ障害の再発が0件\n## チーム育成\n1on1|メンバー全員と月1回以上30分の1on1を、直近3か月連続で実施し、記録を残している\n役割分担|各メンバーの強みと成長目標を考慮した分担表を作成し、メンバーの合意を得ている\n権限委譲|メンバーに判断を任せる範囲を明確にし、任せた業務へのリーダーの介入が月3回以内\n評価・フィードバック|評価基準を事前に共有し、評価面談で根拠つきのフィードバックを全員に行っている\nオンボーディング|新メン
